name: Counterbranch static comparison
description: Compare static authorization coverage between two Git revisions with the scanner-only edition.

inputs:
  repository:
    description: Absolute checkout path containing base, head, and their merge base; full history is required.
    required: true
  base:
    description: Exact lowercase 40-character target-side commit.
    required: true
  head:
    description: Exact lowercase 40-character candidate commit.
    required: true
  profile:
    description: Optional static scan bounds profile (default, large, or xl).
    required: false
    default: ""
  timeout-seconds:
    description: Whole paired-comparison deadline from 1 to 3600 seconds; scan profiles retain their internal bounds.
    required: false
    default: "1800"
  signup-token:
    description: Reserved signup integration token. Token presence does not authenticate or authorize this Action.
    required: false
    default: ""

outputs:
  outcome:
    description: CLEAN, INCOMPLETE, NEEDS_OWNER_REVIEW, or UNKNOWN.
    value: ${{ steps.run.outputs.outcome || steps.failure.outputs.outcome }}
  has_incomplete:
    description: Whether the validated static assessment contains incomplete evidence.
    value: ${{ steps.run.outputs.has_incomplete || steps.failure.outputs.has_incomplete }}
  report:
    description: Path to the validated JSON comparison.
    value: ${{ steps.run.outputs.report }}
  markdown_report:
    description: Path to the saved Markdown report.
    value: ${{ steps.run.outputs.markdown_report }}
  run_directory:
    description: Path to the static Discovery run directory.
    value: ${{ steps.run.outputs.run_directory }}
  merge_base:
    description: Exact merge base compared with head.
    value: ${{ steps.run.outputs.merge_base }}

runs:
  using: composite
  steps:
    - id: preflight
      shell: bash
      env:
        COUNTERBRANCH_ACTION_SIGNUP_TOKEN: ${{ inputs.signup-token }}
        COUNTERBRANCH_ACTION_ACCESS_MODE: gated
      run: python3 "$GITHUB_ACTION_PATH/run.py" --preflight "$GITHUB_ACTION_PATH/release-manifest.json"
    - id: cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: v3.0.6
    - id: prepare
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        STATE="$(mktemp -d "$RUNNER_TEMP/counterbranch-action.XXXXXX")"
        export GH_CONFIG_DIR="$STATE/gh-config"
        python3 "$GITHUB_ACTION_PATH/acquire.py" --kit \
          --output "$STATE/counterbranch-scanner-kit.tar.gz" \
          > "$STATE/release.json"
        KIT_SHA256="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "$STATE/release.json")"
        KIT_TARGET="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["target"])' "$STATE/release.json")"
        python3 "$GITHUB_ACTION_PATH/scanner_kit.py" \
          --archive "$STATE/counterbranch-scanner-kit.tar.gz" \
          --sha256 "$KIT_SHA256" \
          --release-manifest "$GITHUB_ACTION_PATH/release-manifest.json" \
          --target "$KIT_TARGET" --prefix "$STATE/kit"
        printf '%s\n' "COUNTERBRANCH_SCANNER_BINARY=$STATE/kit/bin/counterbranch" >> "$GITHUB_ENV"
    - id: run
      shell: bash
      env:
        COUNTERBRANCH_ACTION_BINARY: ${{ env.COUNTERBRANCH_SCANNER_BINARY }}
        COUNTERBRANCH_ACTION_REPOSITORY: ${{ inputs.repository }}
        COUNTERBRANCH_ACTION_BASE: ${{ inputs.base }}
        COUNTERBRANCH_ACTION_HEAD: ${{ inputs.head }}
        COUNTERBRANCH_ACTION_PROFILE: ${{ inputs.profile }}
        COUNTERBRANCH_ACTION_TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        COUNTERBRANCH_ACTION_SIGNUP_TOKEN: ${{ inputs.signup-token }}
        COUNTERBRANCH_ACTION_ACCESS_MODE: gated
      run: python3 "$GITHUB_ACTION_PATH/run.py"
    - id: failure
      if: failure()
      shell: bash
      run: |
        {
          echo 'outcome=UNKNOWN'
          echo 'has_incomplete=true'
        } >> "$GITHUB_OUTPUT"
        {
          echo '## Counterbranch static comparison'
          echo
          echo 'Outcome: **UNKNOWN**'
          echo
          echo 'Static comparison setup, acquisition, authentication, or validation failed before a complete result was available.'
        } >> "$GITHUB_STEP_SUMMARY"
